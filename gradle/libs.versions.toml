[versions]
koin = "4.2.2"
kotlin = "2.4.0"
logback = "1.5.35"
googleAuth = "1.39.0"
googleApiClient = "2.7.2"
googleDrive = "v3-rev20220815-2.0.0"
googleSheets = "v4-rev20220927-2.0.0"
kotlinxDatetime = "0.8.0"
gigachat = "0.1.18"
exposedBom = "1.3.1"
sqliteJdbc = "3.50.3.0"
shadow = "9.5.1"

[libraries]
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-loggerSlf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
google-auth = { module = "com.google.oauth-client:google-oauth-client-jetty", version.ref = "googleAuth" }
google-apiClient = { module = "com.google.api-client:google-api-client", version.ref = "googleApiClient" }
google-drive = { module = "com.google.apis:google-api-services-drive", version.ref = "googleDrive" }
google-sheets = { module = "com.google.apis:google-api-services-sheets", version.ref = "googleSheets" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime-jvm", version.ref = "kotlinxDatetime" }
gigachat = { module = "chat.giga:gigachat-java", version.ref = "gigachat" }
exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposedBom" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

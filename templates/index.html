<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compass Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/logo/favicon.svg">
  <link rel="stylesheet" href="/static/vue/app.css">
</head>
<body>
  <m3e-theme strong-focus scheme="light"><div id="app"><div style="display:grid;height:100%;place-items:center;font:500 16px Roboto,sans-serif">Загрузка…</div></div></m3e-theme>
  <script>
    window.__APP_CONFIG__ = { canAccessConfig: ${canAccessConfig?c} };
    window.formatScheduleDate = function(value) {
      if (!value) return '';
      const date = new Date(value);
      if (isNaN(date.getTime())) return value;

      const now = new Date();
      const isToday = date.toDateString() === now.toDateString();

      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      const isYesterday = date.toDateString() === yesterday.toDateString();

      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const time = hours + ':' + minutes;

      if (isToday) return time;
      if (isYesterday) return 'вчера, ' + time;

      const monthAbbrs = ['янв.', 'фев.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
      const day = date.getDate();
      const month = monthAbbrs[date.getMonth()];

      if (date.getFullYear() === now.getFullYear()) {
        return day + ' ' + month + ' ' + time;
      }
      return day + ' ' + month + ' ' + date.getFullYear() + ' г.';
    };
  </script>
  <script type="module" src="/static/vue/app.js"></script>
</body>
</html>

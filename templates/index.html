<!DOCTYPE html>
<html lang="ru" style="color-scheme: light;">

<head>
    <meta charset="UTF-8">
    <title>Compass Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="icon" type="image/png" href="/static/logo/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/logo/favicon.svg" />
    <link rel="shortcut icon" href="/static/logo/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/logo/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Compass Admin" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@m3e/web@2.5.16/dist/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4/dist/sse.min.js"></script>
</head>

<body>
    <m3e-theme strong-focus>
        <div class="app-layout">
            <div class="nav-column">
            <m3e-nav-rail id="nav-rail">
                <m3e-icon-button toggle>
                    <m3e-icon name="menu" variant="rounded"></m3e-icon>
                    <m3e-icon slot="selected" name="menu_open"></m3e-icon>
                    <m3e-nav-rail-toggle for="nav-rail"></m3e-nav-rail-toggle>
                </m3e-icon-button>
                <m3e-nav-item class="active-nav-item" data-route="/schedule" hx-get="/schedule" hx-target="#content-area" hx-trigger="click" hx-push-url="/schedule" active selected>
                    <m3e-icon slot="icon" name="calendar_today" variant="rounded"></m3e-icon>
                    <m3e-icon slot="selected" name="calendar_today" variant="rounded"></m3e-icon>
                    <span class="nav-item-label">Расписание</span>
                </m3e-nav-item>
                <m3e-nav-item data-route="/teachers" hx-get="/teachers" hx-target="#content-area" hx-trigger="click" hx-push-url="/teachers">
                    <m3e-icon slot="icon" name="co_present" variant="rounded"></m3e-icon>
                    <m3e-icon slot="selected" name="co_present" variant="rounded"></m3e-icon>
                    <span class="nav-item-label">Преподаватели</span>
                </m3e-nav-item>
                <#if canAccessConfig>
                <m3e-nav-item data-route="/config" hx-get="/config" hx-target="#content-area" hx-trigger="click" hx-push-url="/config">
                    <m3e-icon slot="icon" name="call_merge" variant="rounded"></m3e-icon>
                    <m3e-icon slot="selected" name="call_merge" variant="rounded"></m3e-icon>
                    <span class="nav-item-label">Конфиг</span>
                </m3e-nav-item>
                </#if>
            </m3e-nav-rail>
            <div class="nav-column-spacer"></div>
            <form class="logout-form logout-form-outside" method="post" action="/auth/logout">
                <m3e-icon-button type="submit" aria-label="Выход">
                    <m3e-icon name="logout"></m3e-icon>
                </m3e-icon-button>
            </form>
            </div>

            <main class="app-content">
                <div id="content-area" hx-get="${initialContentUrl}" hx-trigger="load" hx-swap="innerHTML" hx-replace-url="${initialContentUrl}">
                    <div class="loader-wrapper">
                        <span class="loader-text">Подключение к Google Drive...</span>
                    </div>
                </div>
            </main>
        </div>
    </m3e-theme>

    <script>
        function setActiveNav(route) {
            const rail = document.getElementById('nav-rail');
            if (!rail) return;

            const activeRoute = routeForPath(route);
            if (!activeRoute) return;

            rail.querySelectorAll('m3e-nav-item').forEach(item => {
                if (item.dataset.route === activeRoute) {
                    item.classList.add('active-nav-item');
                    item.active = true;
                    item.selected = true;
                    item.setAttribute('active', '');
                    item.setAttribute('selected', '');
                } else {
                    item.classList.remove('active-nav-item');
                    item.active = false;
                    item.selected = false;
                    item.removeAttribute('active');
                    item.removeAttribute('selected');
                }
            });
        }

        function routeForPath(path) {
            if (!path) return null;

            const cleanPath = path.split('?')[0];
            if (cleanPath === '/' || cleanPath.startsWith('/schedule')) {
                return '/schedule';
            }
            if (cleanPath.startsWith('/teachers')) {
                return '/teachers';
            }
            if (cleanPath.startsWith('/config')) {
                return '/config';
            }

            return null;
        }

        document.addEventListener('click', function (e) {
            const navItem = e.target.closest('m3e-nav-item[data-route]');
            if (navItem) {
                setActiveNav(navItem.dataset.route);
            }
        });

        document.addEventListener('htmx:afterOnLoad', function (e) {
            const path = e.detail.pathInfo && e.detail.pathInfo.requestPath;
            if (path) {
                setActiveNav(path);
            }
        });

        customElements.whenDefined('m3e-nav-item')
            .then(() => setActiveNav(window.location.pathname))
            .catch(() => setActiveNav(window.location.pathname));
        document.addEventListener('DOMContentLoaded', () => setActiveNav(window.location.pathname));
    </script>
</body>

</html>

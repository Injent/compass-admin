<div id="schedule-list-container"
     data-groups-to-remove="<#if groupsToRemove?has_content>${groupsToRemove?join(', ')?html}</#if>"
     hx-ext="sse"
     sse-connect="/schedule/list/sse<#if filter != "all">?f=${filter}</#if>">
  <div class="schedule-filter-row">
    <m3e-filter-chip-set id="status-filter-chips" aria-label="Фильтр по статусу">
      <m3e-filter-chip id="chip-all"
                       data-filter="all"
                       hx-get="/schedule/list"
                       hx-target="#schedule-list-container"
                       hx-swap="outerHTML"
                       hx-push-url="/schedule"
                       <#if filter == "all">selected</#if>>Все</m3e-filter-chip>
      <m3e-filter-chip id="chip-ready"
                       data-filter="valid"
                       hx-get="/schedule/list?f=valid"
                       hx-target="#schedule-list-container"
                       hx-swap="outerHTML"
                       hx-push-url="/schedule?f=valid"
                       <#if filter == "valid">selected</#if>>Проверенные</m3e-filter-chip>
      <m3e-filter-chip id="chip-error"
                       data-filter="invalid"
                       hx-get="/schedule/list?f=invalid"
                       hx-target="#schedule-list-container"
                       hx-swap="outerHTML"
                       hx-push-url="/schedule?f=invalid"
                       <#if filter == "invalid">selected</#if>>С ошибками</m3e-filter-chip>
      <m3e-filter-chip id="chip-deleted"
                       data-filter="deleted"
                       hx-get="/schedule/list?f=deleted"
                       hx-target="#schedule-list-container"
                       hx-swap="outerHTML"
                       hx-push-url="/schedule?f=deleted"
                       <#if filter == "deleted">selected</#if>>Удаленные</m3e-filter-chip>
    </m3e-filter-chip-set>
    <div id="schedule-approve-button-wrapper" <#if !allActiveFilesValid>hidden</#if>>
    <m3e-button id="schedule-approve-button" variant="tonal">
      <m3e-dialog-trigger for="schedule-approve-dialog">Подтвердить расписание</m3e-dialog-trigger>
    </m3e-button>
    </div>
  </div>
  <div id="schedule-list-groups-notice" class="schedule-remove-groups-notice" <#if !groupsToRemove?has_content>hidden</#if>>
    При подтверждении будут удалены группы:
    <span id="schedule-list-groups"> <#list groupsToRemove as group>${group?html}<#sep>, </#list></span>
  </div>
  <#include "/schedule/schedule_list.html">
</div>

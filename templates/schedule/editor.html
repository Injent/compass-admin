<!DOCTYPE html>
<html>
<head>
  <title>${file.name} - Редактор</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/index.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--md-sys-color-background, #f9f0ef);
      font-family: 'Roboto', sans-serif;
    }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .border-none { border: none; }
    .block { display: block; }
  </style>
</head>
<body>

  <iframe
    src="https://docs.google.com/spreadsheets/d/${file.fileId}/edit"
    class="w-full h-full border-none block"
    allow="autoplay">
  </iframe>

  <div class="m3-snackbar-container">
    <div id="editor-snackbar">
      <#include "/schedule/status_snackbar.html">
    </div>
  </div>

  <script>
    const statusEvents = new EventSource('/schedule/status/sse/${file.fileId?js_string}');
    statusEvents.addEventListener('StatusUpdate', event => {
      document.getElementById('editor-snackbar').innerHTML = event.data;
    });
  </script>

</body>
</html>

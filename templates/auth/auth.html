<!DOCTYPE html>
<html lang="ru" style="color-scheme: light;">

<head>
    <meta charset="UTF-8">
    <title>Compass Admin - Авторизация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&amp;display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/static/css/index.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@m3e/web@2.7.9/dist/all.min.js"></script>
</head>
<body>
<m3e-theme strong-focus>
    <main class="auth-layout">
        <m3e-content-pane class="auth-pane" style="--m3e-content-pane-container-color: var(--md-sys-color-surface-container-lowest)">
            <form id="auth-form" class="auth-form" autocomplete="on">
                <m3e-heading variant="title" size="large">Авторизация</m3e-heading>

                <m3e-form-field variant="outlined">
                    <label slot="label" for="login">Логин</label>
                    <input id="login" name="login" autocomplete="username" tabindex="0" required autofocus />
                </m3e-form-field>

                <m3e-form-field variant="outlined">
                    <label slot="label" for="password">Пароль</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" tabindex="0" required />
                    <button id="toggle-password" class="auth-password-toggle" slot="suffix" type="button" tabindex="0"
                            aria-label="Показать пароль" aria-controls="password" aria-pressed="false">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z" />
                            <circle cx="12" cy="12" r="3" />
                            <path id="password-eye-slash" d="M3 3 21 21" style="display: none" />
                        </svg>
                    </button>
                </m3e-form-field>

                <div id="auth-error" class="auth-error" hidden>Неверный логин или пароль</div>

                <m3e-button id="auth-submit" tabindex="0" variant="filled" size="medium" type="submit">Вход</m3e-button>
            </form>
        </m3e-content-pane>
    </main>
</m3e-theme>

<script>
    (function () {
        const form = document.getElementById('auth-form');
        const error = document.getElementById('auth-error');
        const submit = document.getElementById('auth-submit');
        const next = '${next?js_string}';
        const loginInput = document.getElementById('login');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        togglePassword.addEventListener('click', function (event) {
            event.stopPropagation();
            const show = passwordInput.type === 'password';
            passwordInput.type = show ? 'text' : 'password';
            togglePassword.setAttribute('aria-pressed', String(show));
            togglePassword.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
            document.getElementById('password-eye-slash').style.display = show ? '' : 'none';
        });
        loginInput.addEventListener('keydown', function (event) {
            if (event.key === 'Tab' && !event.shiftKey) {
                event.preventDefault();
                passwordInput.focus();
            }
        });
        passwordInput.addEventListener('keydown', function (event) {
            if (event.key === 'Tab' && event.shiftKey) {
                event.preventDefault();
                loginInput.focus();
            }
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            error.hidden = true;
            submit.disabled = true;
            submit.setAttribute('disabled', '');

            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const bytes = new TextEncoder().encode(login + ':' + password);
            const binary = Array.from(bytes, byte => String.fromCharCode(byte)).join('');
            const token = btoa(binary);

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Basic ' + token
                    },
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    error.hidden = false;
                    return;
                }

                window.location.assign(next || '/');
            } finally {
                submit.disabled = false;
                submit.removeAttribute('disabled');
            }
        });
    })();
</script>
</body>
</html>

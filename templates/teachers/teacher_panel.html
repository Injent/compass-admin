<div id="teacher-row-${teacher.id}" class="teacher-row-wrapper" data-id="${teacher.id}" data-name="${teacher.fullName?html}">
  <m3e-expansion-panel class="teacher-panel"
                       hide-toggle
                       <#if openTeacherId?? && openTeacherId == teacher.id>open</#if>>
    <div class="teacher-panel-header" slot="header">
      <div class="teacher-table-row">
        <m3e-heading class="teacher-table-number" variant="label" size="large">${teacherNumber!""}</m3e-heading>
        <span class="teacher-name">${teacher.fullName?html}</span>
      </div>
      <div class="teacher-row-actions">
        <m3e-icon-button class="teacher-edit-button"
                         data-edit-url="/teachers/${teacher.id}/edit"
                         data-target-id="teacher-row-${teacher.id}">
          <m3e-icon name="edit" variant="rounded"></m3e-icon>
        </m3e-icon-button>
        <m3e-checkbox class="teacher-delete-checkbox"></m3e-checkbox>
      </div>
    </div>

    <#if openTeacherId?? && openTeacherId == teacher.id>
      <form class="teacher-edit-form"
            hx-post="<#if teacher.id == -1>/teachers/new<#else>/teachers/${teacher.id}</#if>"
            hx-target="#teachers-list-container"
            hx-swap="outerHTML"
            data-new-record="${(teacher.id == -1)?c}"
            data-initial-last-name="${teacher.lastName?html}"
            data-initial-first-name="${teacher.firstName?html}"
            data-initial-middle-name="${teacher.middleName?html}">
        <div class="teacher-edit-fields">
          <m3e-form-field variant="outlined" class="density-3">
            <label slot="label" for="teacher-${teacher.id}-last-name">Фамилия</label>
            <input id="teacher-${teacher.id}-last-name" name="lastName" value="${teacher.lastName?html}" required />
            <span slot="hint">Обязательное поле</span>
          </m3e-form-field>
          <m3e-form-field variant="outlined" class="density-3">
            <label slot="label" for="teacher-${teacher.id}-first-name">Имя</label>
            <input id="teacher-${teacher.id}-first-name" name="firstName" value="${teacher.firstName?html}" required />
            <span slot="hint">Обязательное поле</span>
          </m3e-form-field>
          <m3e-form-field variant="outlined" class="density-3">
            <label slot="label" for="teacher-${teacher.id}-middle-name">Отчество</label>
            <input id="teacher-${teacher.id}-middle-name" name="middleName" value="${teacher.middleName?html}" />
          </m3e-form-field>
        </div>
        <div class="teacher-edit-actions">
          <m3e-button type="button"
                      variant="outlined"
                      hx-delete="/teachers/${teacher.id}"
                      hx-target="#teachers-list-container"
                      hx-swap="outerHTML"
                      <#if teacher.id == -1>disabled</#if>>Удалить</m3e-button>
          <m3e-button class="teacher-save-button" type="button" variant="filled" disabled>Сохранить</m3e-button>
          <button class="teacher-native-submit" type="submit" tabindex="-1" aria-hidden="true">Сохранить</button>
        </div>
      </form>
    </#if>
  </m3e-expansion-panel>
</div>

<div class="schedule-header">
  <m3e-search-bar id="teacher-search-bar" clearable>
    <m3e-icon name="search" slot="leading"></m3e-icon>
    <input id="teacher-search-input" name="q" slot="input" placeholder="Поиск преподавателей" value="${teacherQuery?html}" />
  </m3e-search-bar>

  <div class="actions-wrapper">
    <m3e-split-button>
      <m3e-button slot="leading-button" id="teacher-primary-action" data-mode="add">
        <m3e-icon slot="icon" id="teacher-primary-action-icon" name="add" variant="rounded"></m3e-icon>
        Добавить
      </m3e-button>
      <m3e-icon-button slot="trailing-button">
        <m3e-icon name="keyboard_arrow_down"></m3e-icon>
        <m3e-menu-trigger for="teachers-menu"></m3e-menu-trigger>
      </m3e-icon-button>
    </m3e-split-button>

    <m3e-menu id="teachers-menu" position-x="before">
      <m3e-menu-item id="teachers-delete-mode-menu-item">
        <m3e-icon slot="icon" name="delete" variant="rounded"></m3e-icon>
        Удалить
      </m3e-menu-item>
      <m3e-menu-item id="teachers-cancel-delete-mode-menu-item" hidden>
        <m3e-icon slot="icon" name="close" variant="rounded"></m3e-icon>
        Отмена
      </m3e-menu-item>
    </m3e-menu>
    <div id="teachers-menu-stash" hidden></div>
  </div>
</div>

<form id="teachers-delete-form"
      hx-post="/teachers/delete"
      hx-target="#teachers-list-container"
      hx-swap="outerHTML"
      style="display: none;"></form>

<m3e-content-pane class="schedule-pane teachers-pane">
  <#include "/teachers/teachers_list_container.html">
</m3e-content-pane>

<script>
  (function() {
    let teacherDeleteMode = false;
    let teacherSearchTimer = null;

    const menu = document.getElementById('teachers-menu');
    const menuStash = document.getElementById('teachers-menu-stash');
    const deleteMenuItem = document.getElementById('teachers-delete-mode-menu-item');
    const cancelMenuItem = document.getElementById('teachers-cancel-delete-mode-menu-item');
    const primaryButton = () => document.getElementById('teacher-primary-action');
    const primaryIcon = () => document.getElementById('teacher-primary-action-icon');
    const actionList = () => document.querySelector('#teachers-list > .teachers-action-list');
    const teacherRows = () => Array.from(document.querySelectorAll('#teachers-action-list .teacher-row-wrapper[data-id]'));

    const setTeacherPrimaryLabel = (label) => {
      const button = primaryButton();
      if (!button) return;

      Array.from(button.childNodes)
        .filter(node => node.nodeType === Node.TEXT_NODE && node.textContent.trim())
        .forEach(node => {
          const counter = teacherDeleteMode ? ' ' + selectedTeacherIds().length + '/' + selectableTeacherCount() : '';
          node.textContent = ' ' + label + counter;
        });
    };

    const selectedTeacherIds = () => {
      return teacherRows()
        .filter(row => row.style.display !== 'none')
        .filter(row => row.classList.contains('teacher-delete-selected'))
        .map(row => row.getAttribute('data-id'))
        .filter(Boolean)
        .filter((id, index, ids) => ids.indexOf(id) === index);
    };

    const selectableTeacherCount = () => {
      return teacherRows()
        .filter(row => row.style.display !== 'none')
        .length;
    };

    const syncTeacherCheckboxes = () => {
      teacherRows().forEach(row => {
        const checkbox = row.querySelector('.teacher-delete-checkbox');
        if (!checkbox) return;

        const selected = row.classList.contains('teacher-delete-selected');
        checkbox.checked = selected;
        if (selected) {
          checkbox.setAttribute('checked', '');
        } else {
          checkbox.removeAttribute('checked');
        }
      });
    };

    const clearTeacherSelection = () => {
      teacherRows().forEach(row => {
        row.classList.remove('teacher-delete-selected');
      });
      syncTeacherCheckboxes();
    };

    const isTeacherFormChanged = (form) => {
      const lastName = (form.querySelector('input[name="lastName"]')?.value || '').trim();
      const firstName = (form.querySelector('input[name="firstName"]')?.value || '').trim();
      const middleName = (form.querySelector('input[name="middleName"]')?.value || '').trim();

      return !(
        lastName === (form.dataset.initialLastName || '').trim() &&
        firstName === (form.dataset.initialFirstName || '').trim() &&
        middleName === (form.dataset.initialMiddleName || '').trim()
      );
    };

    const hasRequiredTeacherFields = (form) => {
      const lastName = (form.querySelector('input[name="lastName"]')?.value || '').trim();
      const firstName = (form.querySelector('input[name="firstName"]')?.value || '').trim();
      return lastName.length > 0 && firstName.length > 0;
    };

    const canSubmitTeacherForm = (form) => {
      if (!hasRequiredTeacherFields(form)) return false;
      return form.dataset.newRecord === 'true' || isTeacherFormChanged(form);
    };

    const updateTeacherSaveButtons = () => {
      document.querySelectorAll('.teacher-edit-form').forEach(form => {
        const saveButton = form.querySelector('.teacher-save-button');
        if (!saveButton) return;

        const canSubmit = canSubmitTeacherForm(form);
        saveButton.disabled = !canSubmit;
        if (canSubmit) {
          saveButton.removeAttribute('disabled');
        } else {
          saveButton.setAttribute('disabled', '');
        }
      });
    };

    const updateTeachersMenuMode = () => {
      if (!menu || !menuStash || !deleteMenuItem || !cancelMenuItem) return;

      if (teacherDeleteMode) {
        menuStash.appendChild(deleteMenuItem);
        menu.appendChild(cancelMenuItem);
        cancelMenuItem.hidden = false;
      } else {
        menuStash.appendChild(cancelMenuItem);
        menu.appendChild(deleteMenuItem);
        deleteMenuItem.hidden = false;
        cancelMenuItem.hidden = true;
      }
    };

    const applyTeacherDeleteModeState = () => {
      const list = document.getElementById('teachers-list');
      if (list) list.classList.toggle('teacher-delete-mode', teacherDeleteMode);

      teacherRows().forEach(row => {
        const panel = row.querySelector('m3e-expansion-panel.teacher-panel');
        if (!panel) return;

        panel.disabled = teacherDeleteMode;
        if (teacherDeleteMode) {
          panel.setAttribute('disabled', '');
          panel.open = false;
          panel.removeAttribute('open');
        } else {
          panel.removeAttribute('disabled');
          row.classList.remove('teacher-delete-selected');
        }
      });

      syncTeacherCheckboxes();
    };

    const updateTeacherPrimaryAction = () => {
      const button = primaryButton();
      const icon = primaryIcon();
      if (!button || !icon) return;

      updateTeachersMenuMode();
      applyTeacherDeleteModeState();
      syncTeacherCheckboxes();

      if (!teacherDeleteMode) {
        button.dataset.mode = 'add';
        icon.setAttribute('name', 'add');
        setTeacherPrimaryLabel('Добавить');
        return;
      }

      const count = selectedTeacherIds().length;
      if (count > 0) {
        button.dataset.mode = 'delete';
        icon.setAttribute('name', 'delete');
        setTeacherPrimaryLabel('Удалить');
      } else {
        button.dataset.mode = 'cancel-delete';
        icon.setAttribute('name', 'close');
        setTeacherPrimaryLabel('Отмена');
      }
    };

    const enterTeacherDeleteMode = () => {
      teacherDeleteMode = true;
      clearTeacherSelection();
      updateTeacherPrimaryAction();
    };

    const exitTeacherDeleteMode = () => {
      teacherDeleteMode = false;
      clearTeacherSelection();
      updateTeacherPrimaryAction();
    };

    const submitTeachersDeletion = () => {
      const ids = selectedTeacherIds();
      if (ids.length === 0) {
        exitTeacherDeleteMode();
        return;
      }

      const form = document.getElementById('teachers-delete-form');
      if (!form) return;

      form.innerHTML = '';
      ids.forEach(id => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'teacherId';
        input.value = id;
        form.appendChild(input);
      });

      if (form.requestSubmit) {
        form.requestSubmit();
      } else {
        form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      }
    };

    const filterTeachers = () => {
      const input = document.getElementById('teacher-search-input');
      const query = input ? input.value.toLowerCase().trim() : '';

      document.querySelectorAll('#teachers-list > .teachers-action-list').forEach(container => {
        Array.from(container.children).forEach(child => {
          const tag = child.tagName.toLowerCase();
          if (tag === 'm3e-divider') {
            child.style.display = 'none';
            return;
          }

          const searchable = child.classList.contains('teacher-row-wrapper');
          if (!searchable) return;

          const matches = child.textContent.toLowerCase().includes(query);
          child.style.display = matches ? '' : 'none';
          if (matches) {
            const previous = child.previousElementSibling;
            if (previous && previous.tagName.toLowerCase() === 'm3e-divider') {
              previous.style.display = '';
            }
            const next = child.nextElementSibling;
            if (next && next.tagName.toLowerCase() === 'm3e-divider') {
              next.style.display = '';
            }
          }
        });
      });

      syncTeacherCheckboxes();
      updateTeacherPrimaryAction();
    };

    const reloadTeachersBySearch = () => {
      window.clearTimeout(teacherSearchTimer);
      teacherSearchTimer = window.setTimeout(() => {
        const input = document.getElementById('teacher-search-input');
        const query = input ? input.value.trim() : '';
        const url = query ? '/teachers/list?q=' + encodeURIComponent(query) : '/teachers/list';
        htmx.ajax('GET', url, { target: '#teachers-list-container', swap: 'outerHTML' });
      }, 180);
    };

    document.addEventListener('click', function(e) {
      const editButton = e.target.closest('.teacher-edit-button');
      if (!editButton) return;
      if (teacherDeleteMode) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }

      e.preventDefault();
      e.stopPropagation();
      const target = document.getElementById(editButton.dataset.targetId);
      if (target) {
        htmx.ajax('GET', editButton.dataset.editUrl, { target: target, swap: 'outerHTML' });
      }
    }, true);

    document.addEventListener('opening', function(e) {
      const panel = e.target.closest && e.target.closest('m3e-expansion-panel.teacher-panel');
      const row = panel && panel.closest('.teacher-row-wrapper[data-id]');
      if (teacherDeleteMode) {
        if (e.cancelable) e.preventDefault();
        if (panel) {
          panel.open = false;
          panel.removeAttribute('open');
        }
        return;
      }
      if (!panel || !row || panel.querySelector('.teacher-edit-form')) return;

      if (e.cancelable) e.preventDefault();
      panel.open = false;
      panel.removeAttribute('open');

      htmx.ajax('GET', '/teachers/' + row.dataset.id + '/edit', { target: row, swap: 'outerHTML' });
    }, true);

    document.addEventListener('click', function(e) {
      const checkbox = e.target.closest('.teacher-delete-checkbox');
      const row = checkbox && checkbox.closest('.teacher-row-wrapper[data-id]');
      if (!row || !teacherDeleteMode) return;

      e.preventDefault();
      e.stopPropagation();

      const selected = !row.classList.contains('teacher-delete-selected');
      if (selected) {
        row.classList.add('teacher-delete-selected');
      } else {
        row.classList.remove('teacher-delete-selected');
      }

      syncTeacherCheckboxes();
      updateTeacherPrimaryAction();
    }, true);

    document.addEventListener('click', function(e) {
      const primary = e.target.closest('#teacher-primary-action');
      if (primary) {
        if (primary.dataset.mode === 'delete') {
          submitTeachersDeletion();
        } else if (primary.dataset.mode === 'cancel-delete') {
          exitTeacherDeleteMode();
        } else {
          htmx.ajax('POST', '/teachers/add', { target: '#teachers-list-container', swap: 'outerHTML' });
        }
        return;
      }

      if (e.target.closest('#teachers-delete-mode-menu-item')) {
        enterTeacherDeleteMode();
        return;
      }

      if (e.target.closest('#teachers-cancel-delete-mode-menu-item')) {
        exitTeacherDeleteMode();
        return;
      }

      const saveButton = e.target.closest('.teacher-save-button');
      if (saveButton) {
        if (saveButton.disabled || saveButton.hasAttribute('disabled')) return;
        const form = saveButton.closest('form');
        if (form) form.requestSubmit();
        return;
      }
    });

    document.addEventListener('input', function(e) {
      if (e.target.id === 'teacher-search-input') {
        reloadTeachersBySearch();
      } else if (e.target.closest && e.target.closest('.teacher-edit-form')) {
        updateTeacherSaveButtons();
      }
    });

    document.addEventListener('submit', function(e) {
      const form = e.target.closest && e.target.closest('.teacher-edit-form');
      if (form && !canSubmitTeacherForm(form)) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    document.addEventListener('clear', function(e) {
      const searchBar = e.target.closest('#teacher-search-bar');
      if (searchBar) {
        const input = document.getElementById('teacher-search-input');
        if (input) input.value = '';
        reloadTeachersBySearch();
      }
    });

    document.addEventListener('htmx:afterSwap', function(e) {
      if (e.detail.target.id === 'teachers-list-container') {
        if (teacherDeleteMode) {
          exitTeacherDeleteMode();
        } else {
          updateTeacherPrimaryAction();
        }
        filterTeachers();
      } else if (e.detail.target.closest && e.detail.target.closest('#teachers-action-list')) {
        filterTeachers();
        applyTeacherDeleteModeState();
        updateTeacherSaveButtons();
      }
    });

    document.addEventListener('htmx:afterSettle', function(e) {
      const requestPath = e.detail.requestConfig && e.detail.requestConfig.path;
      if (!teacherDeleteMode || !requestPath || !requestPath.startsWith('/teachers/chunk')) return;

      filterTeachers();
      applyTeacherDeleteModeState();
      updateTeacherSaveButtons();
    });

    updateTeacherPrimaryAction();
    filterTeachers();
    updateTeacherSaveButtons();
  })();
</script>
